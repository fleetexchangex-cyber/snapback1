name: Snapback scan

on:
  schedule:
    # Every 15 minutes, Monday to Friday, 12:00-20:45 UTC
    # = 13:00-21:45 Stockholm in winter, covering US pre-market filings and the whole US session.
    - cron: "*/15 12-20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal, test (send a Telegram test message) or dry (print alerts to the log only)"
        default: normal

permissions:
  contents: write

concurrency:
  group: snapback
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DROP_PCT: ${{ vars.DROP_PCT || '7' }}
          UP_PCT: ${{ vars.UP_PCT || '10' }}
        run: |
          case "${{ inputs.mode }}" in
            test) python snapback.py --test ;;
            dry)  DRY_RUN=1 python snapback.py --force ;;
            *)    python snapback.py ;;
          esac
      - name: Save what was already alerted
        if: ${{ inputs.mode != 'dry' }}
        run: |
          git config user.name "snapback-bot"
          git config user.email "snapback-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "state" && git push)
