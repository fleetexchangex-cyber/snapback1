name: Snapback scan

on:
  schedule:
    # every 15 minutes during US market hours (13:30-21:00 UTC covers summer and winter time), Mon-Fri
    - cron: "*/15 13-20 * * 1-5"
    - cron: "5 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapback
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DROP_PCT: ${{ vars.DROP_PCT || '7' }}
        run: python snapback.py
      - name: Save which stocks were already alerted today
        run: |
          git config user.name "snapback-bot"
          git config user.email "snapback-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
